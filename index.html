<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Tic Tac Toe</h1>

    <div id="inputs">
        <div id="p1-input">
            <label for="player1">Player 1</label>
            <input id="player1" type="text">
        </div>
        
        <div id="p2-input"> 
            <label for="player2">Player 2</label>
            <input id="player2" type="text">
        </div>
        
    </div>

    <button id="start-btn">Play!</button>

    <div id="results"></div>

    <div id="game-container">
        <div class="square" id="0-square"></div>

        <div class="square" id="1-square"></div>

        <div class="square" id="2-square"></div>

        <div class="square" id="3-square"></div>

        <div class="square" id="4-square"></div>

        <div class="square" id="5-square"></div>

        <div class="square" id="6-square"></div>

        <div class="square" id="7-square"></div>

        <div class="square" id="8-square"></div>
    </div>

    <script src="scripts.js" defer></script>
</body>
</html>
