<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <div class="square" id="0-square">1</div>

        <div class="square" id="1-square">2</div>

        <div class="square" id="2-square">3</div>

        <div class="square" id="3-square">4</div>

        <div class="square" id="4-square">5</div>

        <div class="square" id="5-square">6</div>

        <div class="square" id="6-square">7</div>

        <div class="square" id="7-square">8</div>

        <div class="square" id="8-square">9</div>
    </div>





    <script src="scripts.js" defer></script>
</body>
</html>
